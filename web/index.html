<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axolotl Launcher 变更日志可视化</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-left">
                <h1>Axolotl Launcher 变更日志可视化</h1>
                <span class="subtitle" id="versionCount">加载中...</span>
            </div>
            <div class="header-right">
                <div class="control-group">
                    <input type="search" id="searchBox" placeholder="搜索版本..." class="search-input" list="searchHistory" autocomplete="off">
                    <datalist id="searchHistory"></datalist>
                </div>
                <div class="control-group">
                    <label>类型</label>
                    <select id="typeFilter">
                        <option value="all">全部</option>
                        <option value="正式版">正式版</option>
                        <option value="预发布版">预发布版</option>
                        <option value="预发布">预发布</option>
                    </select>
                </div>
                <div class="control-group">
                    <button id="btnHighlightOnly" class="icon-btn" title="仅看高亮版本">★</button>
                </div>
                <div class="control-group">
                    <label>排序</label>
                    <select id="sortOrder">
                        <option value="time-desc">时间倒序</option>
                        <option value="time-asc">时间正序</option>
                        <option value="entries-desc">变更量降序</option>
                        <option value="entries-asc">变更量升序</option>
                        <option value="speed-desc">更新速度降序</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>视角</label>
                    <select id="perspective">
                        <option value="changes">版本改动图</option>
                        <option value="distribution">版本分布图</option>
                        <option value="speed">版本更新速度图</option>
                        <option value="timeline">时间线视图</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>图表</label>
                    <select id="chartType">
                        <option value="bar">条形图</option>
                        <option value="stackedBar">堆叠图</option>
                        <option value="radar">雷达图</option>
                        <option value="line">折线图</option>
                        <option value="area">面积图</option>
                        <option value="stackedArea">堆叠面积图</option>
                        <option value="histogram">直方图</option>
                        <option value="boxplot">箱线图</option>
                        <option value="scatter">散点图</option>
                        <option value="bubble">气泡图</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>配色</label>
                    <select id="colorScheme">
                        <option value="default">默认</option>
                        <option value="warm">暖色</option>
                        <option value="cool">冷色</option>
                        <option value="dark">深色</option>
                        <option value="auto">跟随系统</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>字号</label>
                    <select id="fontSize">
                        <option value="12">小</option>
                        <option value="14" selected>中</option>
                        <option value="16">大</option>
                    </select>
                </div>
                <div class="control-group">
                    <button id="btnFullscreen" class="icon-btn" title="全屏">⛶</button>
                    <button id="btnExport" class="icon-btn" title="导出 PNG">⤓</button>
                    <button id="btnExportJson" class="icon-btn" title="导出 JSON">{ }</button>
                    <button id="btnExportCsv" class="icon-btn" title="导出 CSV">▦</button>
                    <button id="btnTable" class="icon-btn" title="表格视图">≡</button>
                    <button id="btnShare" class="icon-btn" title="分享链接">⧉</button>
                    <button id="btnCompare" class="icon-btn" title="版本对比">⇄</button>
                </div>
            </div>
        </header>

        <!-- Main area -->
        <main>
            <div id="chart"></div>
            <div id="timelineView" class="hidden"></div>
            <div id="tableView" class="hidden">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>版本</th>
                            <th>日期时间</th>
                            <th>类型</th>
                            <th>发布者</th>
                            <th>条目数</th>
                            <th>补充提交</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>

        <!-- Changelog panel -->
        <section id="changelogPanel" class="hidden">
            <div class="panel-header">
                <div class="panel-title">
                    <span id="clVersion"></span>
                    <span id="clDate" class="cl-date"></span>
                    <span id="clType" class="cl-type"></span>
                </div>
                <div class="panel-actions">
                    <button id="clHighlight" class="cl-link">☆ 高亮此版本</button>
                    <button id="clCompare" class="cl-link">⇄ 加入对比</button>
                    <a id="clUrl" target="_blank" class="cl-link">GitHub 链接</a>
                    <button id="clClose" class="cl-close">关闭</button>
                </div>
            </div>
            <div id="clBody" class="panel-body">
                <input type="search" id="clSearch" placeholder="在更新日志中搜索..." class="cl-search-input">
                <div id="clEntries"></div>
            </div>
        </section>

        <!-- Compare panel -->
        <section id="comparePanel" class="hidden">
            <div class="panel-header">
                <div class="panel-title">
                    <span>版本对比</span>
                    <span id="compareInfo" class="cl-date"></span>
                </div>
                <div class="panel-actions">
                    <button id="compareClear" class="cl-close">清空</button>
                    <button id="compareClose" class="cl-close">关闭</button>
                </div>
            </div>
            <div id="compareBody" class="panel-body"></div>
        </section>

        <!-- Hint -->
        <div id="hint" class="hint">点击图表中的顶点查看对应版本的更新日志</div>
    </div>

    <script src="echarts.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

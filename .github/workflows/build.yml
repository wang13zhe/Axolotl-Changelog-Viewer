name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            goos: windows
            artifact: axolotl-changelog-viewer-windows-amd64.exe
          - os: windows-latest
            arch: arm64
            goos: windows
            artifact: axolotl-changelog-viewer-windows-arm64.exe
          - os: ubuntu-latest
            arch: amd64
            goos: linux
            artifact: axolotl-changelog-viewer-linux-amd64
          - os: ubuntu-latest
            arch: arm64
            goos: linux
            artifact: axolotl-changelog-viewer-linux-arm64
          - os: macos-latest
            arch: amd64
            goos: darwin
            artifact: axolotl-changelog-viewer-darwin-amd64
          - os: macos-latest
            arch: arm64
            goos: darwin
            artifact: axolotl-changelog-viewer-darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w" -o dist/${{ matrix.artifact }} ./cmd/server

      - name: Copy web assets
        run: |
          mkdir -p dist/data
          cp -r web/* dist/
          cp -r data/* dist/data/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/web/
            dist/data/
